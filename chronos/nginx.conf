server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos directos
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Puedes ajustar logs si quieres menos verboso
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
